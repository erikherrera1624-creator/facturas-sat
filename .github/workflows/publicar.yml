name: Publicar nueva version

# Se ejecuta con el boton "Run workflow" en la pestaña "Actions" de GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar version
        run: node scripts/preparar-version.js
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Crear instalador y publicarlo
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
